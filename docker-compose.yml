services:
  migrate:
    container_name: friend-seek-migrate
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    networks:
      - friend-seek
    restart: "no"

  api:
    container_name: friend-seek-backend
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    ports:
      - "${HTTP_PORT:-8081}:8081"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    stop_grace_period: 15s
    networks:
      - friend-seek
    restart: unless-stopped

  npm:
    container_name: friend-seek-npm
    image: jc21/nginx-proxy-manager:latest
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./data/npm:/data
      - ./data/letsencrypt:/etc/letsencrypt
    networks:
      - friend-seek
    restart: unless-stopped

networks:
  friend-seek:
    name: friend-seek
    driver: bridge
